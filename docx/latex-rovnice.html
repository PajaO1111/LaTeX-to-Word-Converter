<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>LaTeX → HTML export</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 2rem; color: #17202a; background: #f4f7fa; }
    h1, h2, h3 { margin-bottom: 0.5rem; }
    .formula-item { background: #fff; border: 1px solid #d9e1e8; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .formula-render { background: #fbfdff; border: 1px solid #d9e1e8; border-radius: 8px; padding: 1.25rem; overflow-x: auto; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f0f3f6; padding: 0.75rem; border-radius: 8px; }
    .source-block { margin-bottom: 1.5rem; }
    .formula-error { color: #b42318; font-weight: 600; }
  </style>
</head>
<body>
  <h1>LaTeX do HTML</h1>
    <section class="source-block">
      <h2>Zdrojový text</h2>
      <pre>[ x^2 + y^2 = z^2 ]</pre>
    </section>
  <section>
    <h2>Vyhodnocené rovnice</h2>
      <article class="formula-item">
        <h3>Rovnice 1</h3>
        <div class="formula-render"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>z</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">x^2 + y^2 = z^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.9474em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.0585em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8641em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span></div>
        <pre>x^2 + y^2 = z^2</pre>
      </article>
  </section>
</body>
</html>
