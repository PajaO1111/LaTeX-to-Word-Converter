<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>LaTeX → HTML export</title>
    <style>
      body {
        margin: 2rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #17202a;
        background: #f4f7fa;
        line-height: 1.6;
      }
      h1,
      h2,
      h3 {
        margin: 0 0 0.75rem;
      }
      .source-box,
      .equation-annotation {
        background: #fff;
        border: 1px solid #d9e1e8;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
      }
      .source-box pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f0f3f6;
        border-radius: 8px;
        padding: 0.85rem;
      }
      .annotation-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #63707c;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .equation-render {
        overflow-x: auto;
        background: #fbfdff;
        border: 1px solid #d9e1e8;
        border-radius: 8px;
        padding: 1rem;
      }
      .no-equations {
        color: #63707c;
      }
      .formula-error {
        color: #b42318;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>LaTeX do HTML</h1>



      <div class="equation-annotation">
        
        <div class="equation-render">
          <span class="katex-display">
            <span class="katex">
              <span class="katex-mathml">
                <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
                  <semantics>
                    <mrow>
                      <msup><mi>x</mi><mn>2</mn></msup>
                      <mo>+</mo>
                      <msup><mi>y</mi><mn>2</mn></msup>
                      <mo>=</mo>
                      <msup><mi>z</mi><mn>2</mn></msup>
                    </mrow>
                    <annotation encoding="application/x-tex"> x^2 + ay^2 = z^2 </annotation>
                  </semantics>
                </math>
              </span>

              <span class="katex-html" aria-hidden="true">
                <!-- celý HTML render rovnice -->
              </span>
            </span>
          </span>
        </div>
      </div>
    </section>
  </body>
</html>
